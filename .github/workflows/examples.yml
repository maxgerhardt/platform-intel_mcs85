name: Examples

on: [push, pull_request]

jobs:
  build:
    # The LLVM 8085 toolchain + gdb + trace packages are now published per-host
    # for Windows, Linux (x86_64) and macOS (arm64), so exercise all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
        example:
          - "examples/omen-alpha-blink"
          - "examples/omen-alpha-blink-asm"
          - "examples/omen-alpha-uart-console"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: |
          python -m pip install -U https://github.com/platformio/platformio/archive/develop.zip
      - name: Install this platform (from checkout)
        run: |
          pio pkg install --global --platform symlink://.
      - name: Build example (all environments)
        run: |
          pio run -d ${{ matrix.example }}
