; OMEN ALPHA interactive UART console example.
;
; Run it interactively in the i8085-trace simulator (the simulator bridges the
; console ACIA to a terminal):
;
;     pio run -e omen_alpha_eeprom -t sim
;
; then type commands:  ping  ->  pong ,  blink 3  ->  blinks the LEDs 3x.
; Ctrl-] exits the terminal (and stops the simulator).
;
; On real hardware: `pio run -t upload` over Hexload, then open a serial
; monitor at 115200.

[env:omen_alpha_eeprom]
platform = intel_mcs85
board = omen_alpha
framework = baremetal
board_build.ldscript = src/i8085_eeprom.ld
build_src_filter = +<*> -<crt0_for_ram.S>
monitor_speed = 115200
