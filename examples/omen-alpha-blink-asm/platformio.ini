; OMEN ALPHA baremetal *assembly* blink example.
;
; Pure 8085 assembly (src/blink.S) with no C runtime: the source is its own
; startup. Built as a single EEPROM+RAM image (code in EEPROM at 0x2000+),
; using the EEPROM linker script.
;
; Upload runs over USB serial via the Hexload monitor module at 115200.

[env:omen_alpha_eeprom]
platform = intel_mcs85
board = omen_alpha
framework = baremetal
board_build.ldscript = src/i8085_eeprom.ld

; Optional: allow the undocumented 8085 instructions (off by default).
;board_build.undocumented_insns = yes

; Optional: fix the serial port (otherwise it is autodetected).
;upload_port = COM7
monitor_speed = 115200
