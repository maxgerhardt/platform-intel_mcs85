; OMEN ALPHA baremetal blink + UART example.
;
; The same source is built in two firmware layouts:
;
;   omen_alpha_ram    - the whole image lives in RAM at 0x8000; upload and run.
;                       Volatile: lost on power-off. Good for quick iteration.
;   omen_alpha_eeprom - code and rodata live in EEPROM (0x2000+), while .data
;                       and .bss live in RAM; crt0 copies .data to RAM at boot.
;                       Persistent across power cycles.
;
; Upload uses the Hexload monitor module over USB serial at 115200. After the
; upload the board runs the image and its UART output is streamed to the
; console (Ctrl+C to stop).
;
; Please visit the documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = intel_mcs85
board = omen_alpha
framework = baremetal

; --- Optional: undocumented 8085 instructions ----------------------------- ;
; The real OMEN ALPHA 8085 supports the undocumented opcodes (LDSI/LHLX/SHLX,
; ...), which let the compiler emit smaller/faster code. They are OFF by
; default for portability; uncomment the next line to enable them.
;board_build.undocumented_insns = yes

; --- Optional: run in the i8085-trace simulator instead of flashing --------- ;
; With this set, `pio run -t upload` runs the firmware in the simulator and
; streams the console-UART (ACIA 0xDE/0xDF) output live. Adjust the instruction
; budget (the blink loops forever) with board_upload.sim_max_steps.
;upload_protocol = i8085-trace
;board_upload.sim_max_steps = 4000000

; --- Optional: fix the serial port (otherwise it is autodetected) --------- ;
;upload_port = COM7
monitor_speed = 115200

[env:omen_alpha_ram]
; RAM-only image: everything at 0x8000+, launched via the monitor's Gxxxx.
board_build.ldscript = src/i8085_32k_ram_flat.ld
build_src_filter = +<*> -<crt0_for_eeprom.S>

[env:omen_alpha_eeprom]
; EEPROM+RAM image: code in EEPROM (0x2000+), .data copied to RAM by crt0.
board_build.ldscript = src/i8085_eeprom.ld
build_src_filter = +<*> -<crt0_for_ram.S>
